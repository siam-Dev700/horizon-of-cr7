<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090b">

<title>CR7 — Iconic Moments</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    background: #08090b;
    scroll-behavior: smooth;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
}

html::-webkit-scrollbar {
    display: none;
}

body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    background: #08090b;
}

.scene {
    width: 100%;
    height: 100vh;
    height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
    background: #08090b;

    scroll-snap-align: start;
    scroll-snap-stop: always;
}

.comic-image {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;
    object-position: center;

    background: #08090b;

    -webkit-user-drag: none;
}

/* MOBILE */

@media (max-width: 768px) {
    .scene {
        width: 100%;
        height: 100vh;
        height: 100dvh;
    }

    .comic-image {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }
}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {
    html {
        scroll-behavior: auto;
    }
}
</style>
</head>

<body>

<main>

    <!-- SCENE 01 -->
    <section class="scene">
        <img
            class="comic-image"
            src="../comics-images/cr7-iconic-01-the-night-in-moscow.jpg"
            alt="The Night in Moscow"
            fetchpriority="high">
    </section>


    <!-- SCENE 02 -->
    <section class="scene">
        <img
            class="comic-image"
            src="../comics-images/cr7-iconic-02-la-decima-glory.jpg"
            alt="La Decima Glory"
            loading="lazy">
    </section>


    <!-- SCENE 03 -->
    <section class="scene">
        <img
            class="comic-image"
            src="../comics-images/cr7-iconic-03-the-european-dream.jpg"
            alt="The European Dream"
            loading="lazy">
    </section>


    <!-- SCENE 04 -->
    <section class="scene">
        <img
            class="comic-image"
            src="../comics-images/cr7-iconic-04-the-impossible-bicycle-kick.jpg"
            alt="The Impossible Bicycle Kick"
            loading="lazy">
    </section>


    <!-- SCENE 05 -->
    <section class="scene">
        <img
            class="comic-image"
            src="../comics-images/cr7-iconic-05-the-hat-trick-hero.jpg"
            alt="The Hat Trick Hero"
            loading="lazy">
    </section>


    <!-- SCENE 06 -->
    <section class="scene">
        <img
            class="comic-image"
            src="../comics-images/cr7-iconic-06-back-to-old-trafford.jpg"
            alt="Back to Old Trafford"
            loading="lazy">
    </section>

</main>

</body>
</html>
