<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090b">

<title>CR7 — The Evolution</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    background: #08090b;
    scroll-behavior: smooth;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
}

html::-webkit-scrollbar {
    display: none;
}

body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    background: #08090b;
}

/* FULL-SCREEN COMIC PAGES */

.scene {
    width: 100%;
    height: 100vh;
    height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
    background: #08090b;

    scroll-snap-align: start;
    scroll-snap-stop: always;
}

.comic-image {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;
    object-position: center;

    background: #08090b;

    -webkit-user-drag: none;
}

/* MOBILE */

@media (max-width: 768px) {
    .scene {
        width: 100%;
        height: 100vh;
        height: 100dvh;
    }

    .comic-image {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }
}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {
    html {
        scroll-behavior: auto;
    }
}
</style>
</head>

<body>

<main>

    <!-- SCENE 01 — THE BOY FROM MADEIRA -->

    <section class="scene">
        <img
            class="comic-image"
            src="../comics-images/cr7-evolution-01-the-boy-from-madeira.jpg"
            alt="The Boy From Madeira"
            fetchpriority="high">
    </section>


    <!-- SCENE 02 — THE SPORTING PRODIGY -->

    <section class="scene">
        <img
            class="comic-image"
            src="../comics-images/cr7-evolution-02-the-sporting-prodigy.jpg"
            alt="The Sporting Prodigy"
            loading="lazy">
    </section>


    <!-- SCENE 03 — THE MANCHESTER TRANSFORMATION -->

    <section class="scene">
        <img
            class="comic-image"
            src="../comics-images/cr7-evolution-03-the-manchester-transformation.jpg"
            alt="The Manchester Transformation"
            loading="lazy">
    </section>


    <!-- SCENE 04 — THE MADRID PRIME -->

    <section class="scene">
        <img
            class="comic-image"
            src="../comics-images/cr7-evolution-04-the-madrid-prime.jpg"
            alt="The Madrid Prime"
            loading="lazy">
    </section>


    <!-- SCENE 05 — THE GLOBAL ICON -->

    <section class="scene">
        <img
            class="comic-image"
            src="../comics-images/cr7-evolution-05-the-global-icon.jpg"
            alt="The Global Icon"
            loading="lazy">
    </section>


    <!-- SCENE 06 — THE MODERN LEGEND -->

    <section class="scene">
        <img
            class="comic-image"
            src="../comics-images/cr7-evolution-06-the-modern-legend.jpg"
            alt="The Modern Legend"
            loading="lazy">
    </section>

</main>

</body>
</html>
