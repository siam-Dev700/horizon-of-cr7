<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090b">

<title>CR7 — A Legacy in Frames</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    background: #08090b;
    scroll-behavior: smooth;
    scroll-snap-type: y proximity;
    scrollbar-width: none;
}

html::-webkit-scrollbar {
    display: none;
}

body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    background: #08090b;
}

/* FULL-SCREEN COMIC IMAGES */

.comic-image {
    display: block;

    width: 100%;
    height: 100vh;
    height: 100dvh;

    object-fit: contain;
    object-position: center;

    background: #08090b;

    scroll-snap-align: start;
}

/* MOBILE */

@media (max-width: 768px) {
    .comic-image {
        width: 100%;
        height: 100vh;
        height: 100dvh;

        object-fit: contain;
    }
}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {
    html {
        scroll-behavior: auto;
    }
}
</style>
</head>
