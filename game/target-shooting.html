// One physics model shared by the trajectory preview and the real ball (gravity + quadratic drag + Magnus spin)
const R=.11,G=-9.81,GW=3.66,GH=2.44,SPOT=11,PH=1/240,KD=.02,KM=.23;
function adv(s,h){const v=s.v,p=s.p,sp=Math.hypot(v.x,v.y,v.z),w=s.w;
 v.x+=(-KD*sp*v.x+KM*w*v.z)*h;v.y+=(G-KD*sp*v.y)*h;v.z+=(-KD*sp*v.z-KM*w*v.x)*h;

 if(p.y<R){p.y=R;if(v.y<0){v.y=-v.y*.62;if(v.y<.9)v.y=0}const f=Math.exp(-(v.y?.2:.8)*h*1.4);v.x*=f;v.z*=f}}

 for(let i=0;i<1200;i++){const px=s.p.x,py=s.p.y,pz=s.p.z;adv(s,PH);
  if(s.p.z<=0){const f=pz/(pz-s.p.z);if(n<lim){pts[3*n]=px+(s.p.x-px)*f;pts[3*n+1]=py+(s.p.y-py)*f;pts[3*n+2]=0;n++}
   return{x:px+(s.p.x-px)*f,y:py+(s.p.y-py)*f,t:(i+f)*PH,n}}
  if(i%8===0&&n<lim){pts[3*n]=s.p.x;pts[3*n+1]=s.p.y;pts[3*n+2]=s.p.z;n++}}

/* ---------- AUDIO (procedural Web Audio: no external files) ---------- */
const A={ctx:null,on:{m:true,s:true},vol:{m:.45,s:.8}};

 const n=c.createBufferSource();n.buffer=nb;n.loop=true;const f=c.createBiquadFilter();f.type="bandpass";f.frequency.value=700;f.Q.value=.5;

 const ch=[[110,164.8,220,261.6],[87.3,130.8,174.6,261.6],[130.8,196,261.6,329.6],[98,146.8,196,293.7]];let k=0;

  e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(.05,t+2);e.gain.linearRampToValueAtTime(0,t+6.2);

function tone(f,dur,type,v,to){if(!A.ctx)return;const c=A.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();

const pitchTex=canvasTex(680,520,(x)=>{for(let i=0;i<14;i++){x.fillStyle=i%2?"#2f7d32":"#37893a";x.fillRect(0,i*40,680,40)}

 for(const k of["L","R"]){const kn=new T.Group();kn.position.y=-.45;H["leg"+k].add(kn);bx(.13,.42,.13,0x0c5b2e,0,-.21,0,kn);bx(.13,.08,.27,0x111111,0,-.45,.06,kn);H["knee"+k]=kn;bx(.09,.2,.09,skin,0,-.52,0,H["arm"+k])}

const ROWS=[.6,1.3,2.0],SZ=[{r:.33,pts:20,spd:.5,tint:0x7fb2ff},{r:.26,pts:30,spd:.7,tint:0xffffff},{r:.2,pts:50,spd:.9,tint:0xffd24a}];
const tgGeo=new T.CylinderGeometry(1,1,.05,32);
const ringTex=canvasTex(128,128,(x)=>{const cols=["#c0392b","#fff","#c0392b","#fff","#15151a"];for(let i=0;i<5;i++){x.fillStyle=cols[i];x.beginPath();x.arc(64,64,64-i*12,0,7);x.fill()}});
const tgSide=new T.MeshStandardMaterial({color:0x222222}),tgCap=SZ.map(s=>new T.MeshStandardMaterial({map:ringTex,color:s.tint,roughness:.6}));
const TG=[];
function spawn(i){const k=(Math.random()*3)|0,s=SZ[k],t=TG[i]||(TG[i]={});
 Object.assign(t,{y:ROWS[i],r:s.r,pts:s.pts,spd:s.spd*(.85+Math.random()*.3),cx:(Math.random()-.5)*3,amp:1.5,ph:Math.random()*6.28,alive:true,pop:0,x:0});
 if(!t.m){t.m=new T.Mesh(tgGeo,[tgSide,tgCap[0],tgCap[0]]);t.m.rotation.x=Math.PI/2;t.m.castShadow=true;scene.add(t.m)}
 t.m.material=[tgSide,tgCap[k],tgCap[k]];t.m.scale.set(s.r,1,s.r);t.m.visible=true;t.x=t.cx+t.amp*Math.sin(S.pt*t.spd+t.ph);t.m.position.set(t.x,t.y,-.03)}
const PA=[],pg=new T.BoxGeometry(.07,.07,.07);
for(let i=0;i<40;i++){const m=new T.Mesh(pg,new T.MeshBasicMaterial({color:[0xd4af37,0xc0392b,0xffffff][i%3]}));m.visible=false;scene.add(m);PA.push({m,v:new T.Vector3(),l:0})}
function burst(x,y,z){PA.forEach(q=>{q.m.position.set(x,y,z);q.v.set((Math.random()-.5)*7,Math.random()*5+1,Math.random()*5);q.l=1.3;q.m.visible=true})}
const lineGeo=new T.BufferGeometry();lineGeo.setAttribute("position",new T.BufferAttribute(new Float32Array(64*3),3));
const pre=lineGeo.attributes.position.array;
const line=new T.Line(lineGeo,new T.LineBasicMaterial({color:0xffe28a}));line.frustumCulled=false;line.visible=false;scene.add(line);

/* ---------- STATE ---------- */
const ball={p:{x:0,y:R,z:SPOT},v:{x:0,y:0,z:0},w:0};
const S={st:"menu",shots:0,score:0,hits:0,res:[],aim:{x:0,y:1.3},pw:.6,spin:0,rt:0,resT:0,F:{},t:0,pt:0,acc:0,cel:0,crowdT:9,drag:false,still:0,sh:null,th:0,v0:20};
const keys={},_v=new T.Vector3(),tmp=new T.Vector3(),camT=new T.Vector3(),lookT=new T.Vector3(0,1,0);
const bestGet=()=>{try{return +localStorage.getItem("cr7best")||0}catch(e){return 0}};
const bestSet=v=>{try{localStorage.setItem("cr7best",v)}catch(e){}};
function hud(){const m=S.res.length-S.hits;$("score").textContent=S.score;
 $("stats").textContent="Hits "+S.hits+" · Miss "+m+" · Acc "+(S.res.length?Math.round(S.hits/S.res.length*100):0)+"%";
 $("dots").innerHTML=Array.from({length:SHOTS},(_,i)=>{const r=S.res[i];return `<i class="${r==="hit"?"g":r?"x":""}">${r==="hit"?"✓":r?"✕":""}</i>`}).join("")}
function reset(){ball.p.x=0;ball.p.y=R;ball.p.z=SPOT;ball.v.x=ball.v.y=ball.v.z=0;ball.w=0;S.F={};S.st="aim";S.rt=0;S.cel=0;S.still=0;S.acc=0;$("res").classList.remove("on");
 P.g.position.copy(PSTART);P.g.position.y=0;P.g.rotation.set(0,Math.atan2(PEND.x-PSTART.x,PEND.z-PSTART.z),0);
 $("hint").textContent=mobile?"Touch / drag to aim · set POWER · tap SHOOT":"Move mouse (or arrows) to aim · set POWER · click SHOOT or press SPACE";hud()}
function newGame(){S.shots=0;S.score=0;S.hits=0;S.res=[];for(let i=0;i<3;i++)spawn(i);reset()}

/* ---------- INPUT (pointer events only: no mouse/touch conflict) ---------- */
const ray=new T.Raycaster(),plane=new T.Plane(new T.Vector3(0,0,1),0),ndc=new T.Vector2(),hp=new T.Vector3();
function aimFromPointer(e){const oy=e.pointerType==="touch"?-50:0;ndc.set(e.clientX/innerWidth*2-1,-((e.clientY+oy)/innerHeight*2-1));cam.updateMatrixWorld();ray.setFromCamera(ndc,cam);
 if(ray.ray.intersectPlane(plane,hp)){S.aim.x=clamp(hp.x,-3.4,3.4);S.aim.y=clamp(hp.y,.15,2.3)}}
const cv=$("c");
cv.addEventListener("pointermove",e=>{if(S.st==="aim"&&(e.pointerType==="mouse"||S.drag))aimFromPointer(e)});
cv.addEventListener("pointerdown",e=>{audioInit();if(S.st==="aim"){S.drag=true;aimFromPointer(e)}});
addEventListener("pointerup",()=>{S.drag=false});addEventListener("pointercancel",()=>{S.drag=false});
cv.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("touchmove",e=>{if(e.target===cv)e.preventDefault()},{passive:false});
addEventListener("keydown",e=>{keys[e.code]=1;if((e.code==="Space"||e.code==="Enter")&&!e.repeat){if(S.st==="aim")shoot();e.preventDefault()}
 if(e.code==="KeyP")pause();if(e.code==="KeyR"&&S.st!=="menu"&&S.st!=="final")newGame();if(e.code==="KeyM")toggle("m")});
addEventListener("keyup",e=>{keys[e.code]=0});
$("pw").oninput=e=>{S.pw=e.target.value/100;$("pv").textContent=e.target.value};
$("sp").oninput=e=>{S.spin=e.target.value/100;$("sv").textContent=e.target.value};
$("sh").onclick=e=>{e.target.blur();audioInit();shoot()};
function toggle(k){A.on[k]=!A.on[k];$(k==="m"?"bM":"bS").classList.toggle("off",!A.on[k]);audioVol()}
$("bM").onclick=()=>{audioInit();toggle("m")};$("bS").onclick=()=>{audioInit();toggle("s")};
$("vM").oninput=e=>{A.vol.m=e.target.value/100;audioVol()};$("vS").oninput=e=>{A.vol.s=e.target.value/100;audioVol()};
$("bR").onclick=()=>{if(S.st!=="menu"&&S.st!=="final"){audioInit();newGame()}};$("bP").onclick=pause;
let prevSt=null;
function pause(){if(S.st==="paused"){S.st=prevSt;$("menu").classList.add("h")}else if(S.st==="aim"||S.st==="play"||S.st==="result"){prevSt=S.st;S.st="paused";menu("PAUSED","<p>Game paused.</p>","RESUME",pause)}}
function menu(sub,html,btn,fn,btn2,fn2){$("sub").textContent=sub;$("body").innerHTML=html;$("go").textContent=btn;
 $("go").onclick=()=>{audioInit();$("menu").classList.add("h");fn()};
 const g2=$("go2");g2.style.display=btn2?"block":"none";if(btn2){g2.textContent=btn2;g2.onclick=fn2}
 $("menu").classList.remove("h")}
const HOW=`<p><b>Aim</b> – move the mouse (or arrow keys) / touch &amp; drag. The gold reticle marks exactly where you aim on the goal plane.</p><p><b>Power</b> – the slider sets shot speed. Low power = slow lobbed ball, high power = fast flat ball. The gold dotted line is the real flight path (same physics as the ball).</p><p><b>Shoot</b> – hit the moving targets. Small targets score more: 50 / 30 / 20, +10 for the bullseye. Targets move, so lead them. ${SHOTS} shots per round. Optional SPIN bends the ball.</p>`;
function mainMenu(){S.st="menu";menu("TARGET SHOOTING",HOW+`<p>Best score: <b>${bestGet()}</b></p>`,"KICK OFF",newGame)}

/* ---------- SHOOTING ---------- */
function planShot(){S.v0=13+S.pw*17;S.th=solve(S.aim.x,S.aim.y,S.v0,S.spin);const n=flight(S.aim.x,S.v0,S.th,S.spin,pre).n;lineGeo.setDrawRange(0,n);lineGeo.attributes.position.needsUpdate=true}
function shoot(){if(S.st!=="aim")return;audioInit();planShot();S.sh={ax:S.aim.x,v0:S.v0,th:S.th,w:S.spin};S.st="play";S.rt=0;S.F={};S.shots++;sfx("whistle")}
function launch(){const s=S.sh,v=launchV(s.ax,s.v0,s.th);ball.p.x=0;ball.p.y=R;ball.p.z=SPOT;ball.v.x=v.x;ball.v.y=v.y;ball.v.z=v.z;ball.w=s.w;S.F.launched=true;S.F.lt=S.pt;sfx("kick")}
function finish(kind,msg){const F=S.F;if(F.done)return;F.done=true;S.res.push(kind);if(kind==="hit")S.hits++;hud();S.resT=2.2;
 $("res").textContent=msg;$("res").classList.add("on");if(kind!=="hit")sfx("miss")}
function hitTarget(t,d){const bull=d<t.r*.3,pts=t.pts+(bull?10:0);S.score+=pts;t.alive=false;t.pop=0;burst(t.x,t.y,.2);
 ball.v.z=Math.abs(ball.v.z)*.25;ball.v.y=1.5;ball.v.x*=.3;ball.p.z=.05;S.cel=.001;S.crowdT=0;sfx("hit");finish("hit",(bull?"BULLSEYE! +":"TARGET HIT! +")+pts)}
function hit(cx,cy,cz,rad,e){const p=ball.p,v=ball.v;let dx=p.x-cx,dy=p.y-cy,dz=p.z-cz;const L=Math.hypot(dx,dy,dz);
 if(L<R+rad&&L>1e-6){dx/=L;dy/=L;dz/=L;const k=R+rad;p.x=cx+dx*k;p.y=cy+dy*k;p.z=cz+dz*k;const vn=v.x*dx+v.y*dy+v.z*dz;
  if(vn<0){const c=-(1+e)*vn;v.x+=dx*c;v.y+=dy*c;v.z+=dz*c;return -vn}}return 0}
// fixed-timestep physics tick (1/240 s): identical integrator to the preview (adv)
function phys(){const F=S.F;for(const t of TG)if(t.alive)t.x=t.cx+t.amp*Math.sin(S.pt*t.spd+t.ph);
 if(!F.launched)return;const p=ball.p,v=ball.v,px=p.x,py=p.y,pz=p.z;adv(ball,PH);
 let w=0;for(const s of[-1,1])w=Math.max(w,hit(s*GW,clamp(p.y,0,GH),0,.06,.55));w=Math.max(w,hit(clamp(p.x,-GW,GW),GH,0,.06,.55));
 if(w>2&&S.pt-(F.pq||-1)>.2){F.pq=S.pt;sfx("post")}
 if(!F.passed&&pz>0&&p.z<=0){F.passed=true;const f=pz/(pz-p.z),cx=px+(p.x-px)*f,cy=py+(p.y-py)*f;
  for(const t of TG)if(t.alive){const d=Math.hypot(cx-t.x,cy-t.y);if(d<=t.r+R){hitTarget(t,d);break}}}
 if(p.z<-1.9&&Math.abs(p.x)<GW){p.z=-1.9;v.x*=.3;v.y*=.3;v.z*=-.1}
 if(p.z<-6.9){p.z=-6.9;v.z*=-.2}
 if(py>R+.05&&p.y<=R&&v.y>2)sfx("bounce")}

/* ---------- ANIMATION ---------- */
const lerpA=(a,b,k)=>a+(b-a)*k;
function poseIdle(H,t,arm){H.hips.rotation.set(0,0,0);H.hips.position.y=1+Math.sin(t*2)*.005;H.torso.rotation.set(0,0,0);H.legL.rotation.set(0,0,0);H.legR.rotation.set(0,0,0);H.kneeL.rotation.x=H.kneeR.rotation.x=0;
 H.armL.rotation.set(0,0,arm);H.armR.rotation.set(0,0,-arm)}
function poseRun(H,ph){const s=Math.sin(ph)*.9;H.legL.rotation.x=-s;H.legR.rotation.x=s;H.kneeL.rotation.x=.3+Math.max(0,s)*.9;H.kneeR.rotation.x=.3+Math.max(0,-s)*.9;
 H.armL.rotation.set(s*.8,0,.1);H.armR.rotation.set(-s*.8,0,-.1);H.hips.rotation.x=-.12;H.hips.position.y=1+Math.abs(Math.sin(ph))*.05}
function poseKick(H,u){const w=u<.35?u/.35:1,f=Math.max(0,(u-.35)/.65);
 H.legR.rotation.x=u<.35?lerpA(1,-1.25,w*w):lerpA(-1.25,-.2,f);H.kneeR.rotation.x=u<.35?lerpA(1.4,.1,w):lerpA(.1,.5,f);
 H.legL.rotation.x=-.2;H.kneeL.rotation.x=.25;H.armL.rotation.set(0,0,.9);H.armR.rotation.set(.4,0,-.9);H.hips.rotation.x=u<.35?.1:-.1;H.hips.position.y=1}
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;try{if(S.st!=="paused")update(dt);render(dt)}catch(e){console.error(e)}}
function update(dt){S.t+=dt;const F=S.F;
 if(S.st!=="paused"){S.acc+=dt;while(S.acc>=PH){S.acc-=PH;S.pt+=PH;phys()}}
 if(S.st==="aim"){const sp=3*dt;if(keys.ArrowLeft||keys.KeyA)S.aim.x-=sp;if(keys.ArrowRight||keys.KeyD)S.aim.x+=sp;if(keys.ArrowUp||keys.KeyW)S.aim.y+=sp*.7;if(keys.ArrowDown||keys.KeyS)S.aim.y-=sp*.7;
  S.aim.x=clamp(S.aim.x,-3.4,3.4);S.aim.y=clamp(S.aim.y,.15,2.3);planShot();poseIdle(P,S.t,.15)}
 else if(S.st==="play"||S.st==="result"){
  S.rt+=dt;
  if(S.rt<RUN){P.g.position.lerpVectors(PSTART,PEND,S.rt/RUN);poseRun(P,S.rt*13)}
  else if(S.cel<=0){const u=(S.rt-RUN)/KICKT;P.g.rotation.y=lerpA(P.g.rotation.y,Math.PI,1-Math.exp(-14*dt));P.g.position.copy(PEND);poseKick(P,Math.min(u,1));if(!F.launched&&u>=.35)launch()}
  if(S.cel>0){S.cel+=dt;const c=S.cel;P.g.position.set(PEND.x,c<.7?Math.sin(c/.7*Math.PI)*.8:0,PEND.z);P.g.rotation.y=c<.7?Math.PI-c/.7*Math.PI:0;
   poseIdle(P,S.t,.75);P.legL.rotation.z=-.18;P.legR.rotation.z=.18}
  if(F.launched&&!F.done){const sp=Math.hypot(ball.v.x,ball.v.y,ball.v.z);S.still=(sp<.4&&ball.p.y<R+.02)?S.still+dt:0;
   if((F.passed&&ball.p.z<-.6)||S.still>.6||S.pt-F.lt>5||ball.p.z>14)finish("miss","MISS!")}
  if(F.done){S.st="result";S.resT-=dt;if(S.resT<=0){if(S.res.length>=SHOTS)end();else reset()}}}
 else poseIdle(P,S.t,.15);
 for(const t of TG){if(t.alive)t.m.position.set(t.x,t.y,-.03);else{t.pop+=dt;t.m.scale.set(t.r*Math.max(0,1-t.pop*3),1,t.r*Math.max(0,1-t.pop*3));t.m.visible=t.pop<.35;if(t.pop>.9&&S.st!=="final")spawn(TG.indexOf(t))}}
 for(const q of PA)if(q.l>0){q.l-=dt;q.v.y+=G*dt;q.m.position.addScaledVector(q.v,dt);q.m.rotation.x+=dt*8;if(q.l<=0||q.m.position.y<0)q.m.visible=false}
 ballMesh.position.set(ball.p.x,ball.p.y,ball.p.z);const hs=Math.hypot(ball.v.x,ball.v.z);if(hs>.01){_v.set(ball.v.z,0,-ball.v.x).normalize();ballMesh.rotateOnWorldAxis(_v,hs/R*dt)}
 S.crowdT+=dt;crowd.position.y=S.crowdT<3?Math.abs(Math.sin(S.crowdT*9))*.35*(1-S.crowdT/3):0}
function end(){S.st="final";const b=bestGet(),nb=S.score>b;if(nb)bestSet(S.score);$("res").classList.remove("on");
 const acc=Math.round(S.hits/SHOTS*100),msg=acc===100?"Perfect. Pure CR7 precision.":acc>=70?"Clinical shooting.":acc>=40?"Solid, keep practising.":"Keep training from the spot.";
 menu("FULL TIME",`<p style="text-align:center;font-size:34px;font-family:Cinzel,serif;color:var(--gold);margin:6px 0">${S.score} pts</p><p style="text-align:center">Hits ${S.hits} · Misses ${SHOTS-S.hits} · Accuracy ${acc}%<br>${nb?"NEW BEST SCORE!":"Best: "+Math.max(b,S.score)}<br>${msg}</p>`,"PLAY AGAIN",newGame,"MAIN MENU",()=>{mainMenu()})}
function render(dt){
 if(S.st==="menu"||S.st==="final")camT.set(Math.sin(S.t*.3)*3,2.8,16);else camT.set(0,3.3,16.5);
 lookT.set(0,1,0);
 cam.position.lerp(camT,1-Math.exp(-3*dt));cam.lookAt(lookT);
 const c=$("cross"),aimOn=S.st==="aim";line.visible=aimOn;$("ctl").style.visibility=(S.st==="menu"||S.st==="final")?"hidden":"visible";$("hint").style.display=aimOn?"block":"none";$("sh").disabled=!aimOn;
 if(aimOn){tmp.set(S.aim.x,S.aim.y,0).project(cam);c.style.display="block";c.style.left=(tmp.x*.5+.5)*innerWidth+"px";c.style.top=(-tmp.y*.5+.5)*innerHeight+"px"}else c.style.display="none";
 renderer.render(scene,cam)}
newGame();mainMenu();requestAnimationFrame(frame);
}
</script>
<script>
(function(){
function load(u,ok,bad){var s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=bad;document.head.appendChild(s)}
function run(){try{boot()}catch(e){console.error(e);fail("Game failed to start: "+e.message)}}
load("https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js",run,function(){
 load("https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js",run,function(){
  fail("Three.js could not be loaded. Check your internet connection, or download three.min.js (r128) and change the script src to a local file path.")})})
})();
</script>
</body></html>
