"use strict";
const $=id=>document.getElementById(id),T=THREE,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

/* ---------- AUDIO (procedural Web Audio: no external files) ---------- */
const A={ctx:null,on:{m:true,s:true},vol:{m:.45,s:.8}};
function audioInit(){
 if(A.ctx){A.ctx.resume();return}
 const c=A.ctx=new (window.AudioContext||window.webkitAudioContext)();
 A.mb=c.createGain();A.sb=c.createGain();A.mb.connect(c.destination);A.sb.connect(c.destination);audioVol();
 const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;A.nb=nb;
 // crowd ambience
 const n=c.createBufferSource();n.buffer=nb;n.loop=true;const f=c.createBiquadFilter();f.type="bandpass";f.frequency.value=700;f.Q.value=.5;
 const g=c.createGain();g.gain.value=.12;const l=c.createOscillator(),lg=c.createGain();l.frequency.value=.2;lg.gain.value=.04;l.connect(lg);lg.connect(g.gain);l.start();
 n.connect(f);f.connect(g);g.connect(A.sb);n.start();
 // cinematic pad: Am - F - C - G
 const ch=[[110,164.8,220,261.6],[87.3,130.8,174.6,261.6],[130.8,196,261.6,329.6],[98,146.8,196,293.7]];let k=0;
 const pad=()=>{const t=c.currentTime;ch[k++%4].forEach((fr,i)=>{const o=c.createOscillator(),e=c.createGain(),lp=c.createBiquadFilter();
  o.type=i%2?"triangle":"sawtooth";o.frequency.value=fr;lp.type="lowpass";lp.frequency.value=700;
  e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(.05,t+2);e.gain.linearRampToValueAtTime(0,t+6.2);
  o.connect(lp);lp.connect(e);e.connect(A.mb);o.start(t);o.stop(t+6.3)});};

}
function audioVol(){if(!A.ctx)return;A.mb.gain.value=A.on.m?A.vol.m*A.ma:0;A.sb.gain.value=A.on.s?A.vol.s*A.ma:0}
function tone(f,dur,type="sine",v=.3,to=null,vib=0){if(!A.ctx)return;const c=A.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
 if(vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=32;lg.gain.value=vib;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur)}
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(A.sb);o.start(t);o.stop(t+dur)}
function noise(dur,v,f0,f1,type="bandpass",swell=0){if(!A.ctx)return;const c=A.ctx,t=c.currentTime,s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();

 if(swell){g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(v,t+swell);g.gain.linearRampToValueAtTime(.001,t+dur)}else{g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur)}
 s.connect(fl);fl.connect(g);g.connect(A.sb);s.start(t);s.stop(t+dur)}
const SFX={
 whistle(){tone(2900,.35,"sine",.25,null,90);setTimeout(()=>tone(2900,.5,"sine",.25,null,90),420)},

  try{const u=new SpeechSynthesisUtterance("Goal!");u.rate=.9;u.pitch=.8;u.volume=A.on.s?A.vol.s:0;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}},

/* ---------- RENDERER / SCENE ---------- */
const renderer=new T.WebGLRenderer({canvas:$("c"),antialias:!mobile});

addEventListener("resize",resize);resize();
scene.add(new T.HemisphereLight(0x8fa3d9,0x10201a,.7));
const sun=new T.DirectionalLight(0xfff3dd,.9);sun.position.set(10,26,18);sun.castShadow=true;
sun.shadow.mapSize.set(mobile?1024:2048,mobile?1024:2048);Object.assign(sun.shadow.camera,{left:-14,right:14,top:16,bottom:-14,near:1,far:70});sun.target.position.set(0,0,6);scene.add(sun,sun.target);
function canvasTex(w,h,fn){const c=document.createElement("canvas");c.width=w;c.height=h;fn(c.getContext("2d"),w,h);const t=new T.CanvasTexture(c);t.anisotropy=4;return t}
// pitch: world x∈[-34,34], z∈[-12,40] at 10px/m
const pitchTex=canvasTex(680,520,(x)=>{for(let i=0;i<14;i++){x.fillStyle=i%2?"#2f7d32":"#37893a";x.fillRect(0,i*40,680,40)}
 x.strokeStyle="#fff";x.lineWidth=3;const X=m=>(m+34)*10,Z=m=>(m+12)*10;
 x.beginPath();x.moveTo(0,Z(0));x.lineTo(680,Z(0));x.strokeRect(X(-9.16),Z(0),18.32*10,55);x.strokeRect(X(-20.16),Z(0),40.32*10,165);
 x.stroke();x.beginPath();x.arc(X(0),Z(SPOT),91.5,.646,2.495);x.stroke();x.beginPath();x.arc(X(0),Z(SPOT),4,0,7);x.fillStyle="#fff";x.fill()});
const pitch=new T.Mesh(new T.PlaneGeometry(68,52),new T.MeshStandardMaterial({map:pitchTex,roughness:.95}));
pitch.rotation.x=-Math.PI/2;pitch.position.set(0,0,14);pitch.receiveShadow=true;scene.add(pitch);
const ground=new T.Mesh(new T.PlaneGeometry(400,400),new T.MeshBasicMaterial({color:0x07090f}));ground.rotation.x=-Math.PI/2;ground.position.y=-.05;scene.add(ground);
// goal frame + net
const white=new T.MeshStandardMaterial({color:0xffffff,roughness:.4});
const post=(x)=>{const m=new T.Mesh(new T.CylinderGeometry(.06,.06,GH,12),white);m.position.set(x,GH/2,0);m.castShadow=true;scene.add(m)};post(-GW);post(GW);
const bar=new T.Mesh(new T.CylinderGeometry(.06,.06,GW*2,12),white);bar.rotation.z=Math.PI/2;bar.position.y=GH;bar.castShadow=true;scene.add(bar);
const netTex=canvasTex(64,64,(x)=>{x.strokeStyle="rgba(255,255,255,.9)";x.lineWidth=3;x.strokeRect(0,0,64,64)});netTex.wrapS=netTex.wrapT=T.RepeatWrapping;
function netPlane(w,h,x,y,z,rx,ry){const t=netTex.clone();t.needsUpdate=true;t.repeat.set(w*5,h*5);const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:t,transparent:true,opacity:.45,side:T.DoubleSide,depthWrite:false}));m.position.set(x,y,z);m.rotation.set(rx,ry,0);scene.add(m)}
netPlane(GW*2,GH,0,GH/2,-2,0,0);netPlane(2,GH,-GW,GH/2,-1,0,Math.PI/2);netPlane(2,GH,GW,GH/2,-1,0,Math.PI/2);netPlane(GW*2,2,0,GH,-1,Math.PI/2,0);
// stands + crowd
const slabM=new T.MeshStandardMaterial({color:0x14161d,roughness:1});
const slab=(w,l,x,y,z,rx,rz)=>{const m=new T.Mesh(new T.BoxGeometry(w,.3,l),slabM);m.position.set(x,y,z);m.rotation.set(rx,0,rz);scene.add(m)};
slab(80,18,0,6.1,-15.2,.6435,0);slab(18,52,25.2,6.1,14,0,.6435);slab(18,52,-25.2,6.1,14,0,-.6435);
const spots=[];for(let r=0;r<12;r++){for(let x=-34;x<=34;x+=.85)spots.push([x,1.2+r*.9,-8.6-r*1.2]);for(const s of[-1,1])for(let z=-6;z<=36;z+=.9)spots.push([s*(18.6+r*1.2),1.2+r*.9,z])}
const crowd=new T.InstancedMesh(new T.BoxGeometry(.4,.65,.3),new T.MeshStandardMaterial({roughness:1}),spots.length);
const pal=[0xd4af37,0xc0392b,0x1e8c3a,0xeeeeee,0x2b4c9b,0x222222,0xe67e22],dm=new T.Object3D();
spots.forEach((s,i)=>{dm.position.set(s[0]+Math.random()*.2,s[1],s[2]);dm.scale.y=.8+Math.random()*.4;dm.updateMatrix();crowd.setMatrixAt(i,dm.matrix);crowd.setColorAt(i,new T.Color(pal[(Math.random()*pal.length)|0]))});
scene.add(crowd);
// ad board + floodlights
const board=new T.Mesh(new T.PlaneGeometry(60,1.1),new T.MeshBasicMaterial({map:canvasTex(1024,32,(x,w,h)=>{x.fillStyle="#05060a";x.fillRect(0,0,w,h);x.fillStyle="#d4af37";x.font="600 22px Cinzel,serif";x.textAlign="center";x.fillText("HORIZON OF CR7   ·   HORIZON OF CR7   ·   HORIZON OF CR7   ·   HORIZON OF CR7",w/2,24)})}));
board.position.set(0,.55,-7.8);scene.add(board);
for(const [x,z] of[[-32,-8],[32,-8],[-32,34],[32,34]]){const p=new T.Mesh(new T.CylinderGeometry(.3,.4,26,8),new T.MeshStandardMaterial({color:0x333a46}));p.position.set(x,13,z);scene.add(p);
 const l=new T.Mesh(new T.BoxGeometry(5,2.5,.5),new T.MeshBasicMaterial({color:0xfff6d0}));l.position.set(x,26.5,z);l.lookAt(0,5,10);scene.add(l)}
for(const x of[-30,30]){const s=new T.SpotLight(0xfff0d0,.6,120,.7,.5);s.position.set(x,26,-8);s.target.position.set(0,0,8);scene.add(s,s.target)}

/* ---------- HUMANOID RIG (procedural; swap for GLB later via makeHuman replacement) ---------- */
function makeHuman(shirt,shorts,skin,hair,num){
 const g=new T.Group(),M=c=>new T.MeshStandardMaterial({color:c,roughness:.75}),H={g};
 const bx=(w,h,d,c,x,y,z,par)=>{const m=new T.Mesh(new T.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);m.castShadow=true;par.add(m);return m};
 H.hips=new T.Group();H.hips.position.y=1;g.add(H.hips);bx(.38,.2,.22,shorts,0,0,0,H.hips);
 H.torso=new T.Group();H.torso.position.y=.1;H.hips.add(H.torso);bx(.44,.56,.25,shirt,0,.3,0,H.torso);
 bx(.19,.22,.2,skin,0,.8,0,H.torso);bx(.2,.08,.22,hair,0,.93,-.01,H.torso);
 if(num){const p=new T.Mesh(new T.PlaneGeometry(.3,.3),new T.MeshBasicMaterial({map:canvasTex(64,64,(x)=>{x.fillStyle="#fff";x.font="700 56px Cinzel,serif";x.textAlign="center";x.fillText(num,32,52)}),transparent:true}));p.position.set(0,.34,-.13);p.rotation.y=Math.PI;H.torso.add(p)}
 const limb=(x,py,par,len,c,w)=>{const p=new T.Group();p.position.set(x,py,0);par.add(p);bx(w,len,w,c,0,-len/2,0,p);return p};
 H.armL=limb(.3,.52,H.torso,.5,shirt,.11);H.armR=limb(-.3,.52,H.torso,.5,shirt,.11);

 for(const k of["L","R"]){const l=H["leg"+k],kn=new T.Group();kn.position.y=-.45;l.add(kn);bx(.13,.42,.13,0xf2f2f2,0,-.21,0,kn);bx(.13,.08,.27,0x111111,0,-.45,.06,kn);H["knee"+k]=kn;
  const a=H["arm"+k];bx(.09,.2,.09,skin,0,-.52,0,a);const hm=new T.Object3D();hm.position.y=-.65;a.add(hm);H["hand"+k]=hm;
  const sm=new T.Object3D();sm.position.y=-.2;kn.add(sm);H["shin"+k]=sm}
 H.bodyM=new T.Object3D();H.bodyM.position.y=.3;H.torso.add(H.bodyM);H.headM=new T.Object3D();H.headM.position.y=.8;H.torso.add(H.headM);
 scene.add(g);return H}
const P=makeHuman(0xb3122b,0x0c5b2e,0xd9a77f,0x111111,"7"),K=makeHuman(0xe8c81a,0x111111,0xc98f66,0x2a1a10);
const mk=(par,y)=>{const o=new T.Object3D();o.position.y=y;par.add(o);return o};const KP=[[K.bodyM,.42],[K.headM,.26],[K.handL,.36],[K.handR,.36],[K.shinL,.3],[K.shinR,.3],[mk(K.armL,-.3),.3],[mk(K.armR,-.3),.3],[K.kneeL,.28],[K.kneeR,.28],[K.hips,.4]];KP.forEach(a=>a.w=new T.Vector3());
const PSTART=new T.Vector3(-1.9,0,14.6),PEND=new T.Vector3(.38,0,11.75);
// ball
const ballMesh=new T.Mesh(new T.SphereGeometry(R,24,16),new T.MeshStandardMaterial({roughness:.5,map:canvasTex(256,128,(x,w,h)=>{x.fillStyle="#f4f4f4";x.fillRect(0,0,w,h);x.fillStyle="#15151a";
 for(let i=0;i<10;i++)for(let j=0;j<3;j++){const cx=(i+(j%2)*.5)*w/10,cy=(j+.5)*h/3;x.beginPath();for(let k=0;k<5;k++){const a=k*1.2566-1.57;x.lineTo(cx+Math.cos(a)*15,cy+Math.sin(a)*15)}x.fill()}})}));

function hit(cx,cy,cz,rad,e){const p=ball.p,v=ball.v,d=_v.set(p.x-cx,p.y-cy,p.z-cz),L=d.length();
