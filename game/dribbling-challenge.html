/* ================= BALL PHYSICS ================= */
// gravity + quadratic air drag + bounce + rolling resistance (shared by real ball and shot-assist simulation)
function advB(s,h){const v=s.v,p=s.p,sp=Math.hypot(v.x,v.y,v.z);
 v.x-=KD*sp*v.x*h;v.y+=(G-KD*sp*v.y)*h;v.z-=KD*sp*v.z*h;p.x+=v.x*h;p.y+=v.y*h;p.z+=v.z*h;
 if(p.y<R){p.y=R;if(v.y<0){v.y=-v.y*.6;if(v.y<1)v.y=0}
  const s2=Math.hypot(v.x,v.z);if(s2>0){const n=Math.max(0,s2-.8*h)*Math.exp(-.7*h);v.x*=n/s2;v.z*=n/s2}}}
function solveShot(ux,uz,pow,ty,fx,fz){let lo=0,hi=9;for(let i=0;i<16;i++){const m=(lo+hi)/2,s={p:{x:fx,y:R+.2,z:fz},v:{x:ux*pow,y:m,z:uz*pow}};let y=-1;
  for(let k=0;k<240;k++){const pz=s.p.z,py=s.p.y;advB(s,1/60);if(s.p.z<=0){const f=pz/(pz-s.p.z);y=py+(s.p.y-py)*f;break}}
  if(y<ty)lo=m;else hi=m}return(lo+hi)/2}
function hit(cx,cy,cz,rad,e){const p=ball.p,v=ball.v;let dx=p.x-cx,dy=p.y-cy,dz=p.z-cz;const L=Math.hypot(dx,dy,dz);
 if(L<R+rad&&L>1e-6){dx/=L;dy/=L;dz/=L;const k=R+rad;p.x=cx+dx*k;p.y=cy+dy*k;p.z=cz+dz*k;const vn=v.x*dx+v.y*dy+v.z*dz;
  if(vn<0){const c=-(1+e)*vn;v.x+=dx*c;v.y+=dy*c;v.z+=dz*c;return -vn}}return 0}

/* ================= FIXED-STEP SIMULATION ================= */
function scoreGoal(cx,cy){S.st="cel";S.scored=true;S.cel=0;S.resT=2.8;S.rr[S.round]="g";
 const corner=Math.abs(cx)>GW-1.1,pts=100+Math.floor(S.rt)*3+(S.tk===0?50:0)+(corner?25:0);S.score+=pts;S.goals++;S.crowdT=0;

 // --- player movement (acceleration, braking, inertia, normalized diagonals)

 if(al>1e-6){const rate=Math.hypot(tvx,tvz)<sp0?26:(inp.sprint?12:17),m=Math.min(al,rate*h);pl.vx+=ax/al*m;pl.vz+=az/al*m}

  if(d<1.8&&p.y<.5){const fx=Math.sin(pl.h),fz=Math.cos(pl.h);let ux=fx,uz=fz,pow=9+sp*.9+(inp.sprint?1.5:0),vy=0;
   if(p.z<26){const side=K.x>.5?-1:K.x<-.5?1:(Math.random()<.5?-1:1),gx=side*2.4-p.x,gz=-p.z,gl=Math.hypot(gx,gz),gdx=gx/gl,gdz=gz/gl;
    if(fx*gdx+fz*gdz>.77){ux=fx*.3+gdx*.7;uz=fz*.3+gdz*.7;const n=Math.hypot(ux,uz);ux/=n;uz/=n;pow=18+sp*.4;vy=solveShot(ux,uz,pow,.45+Math.random()*1.2,p.x,p.z);
     K.err=(Math.random()-.5)*1.2;K.react=Math.max(.12,.28-.03*S.round)}
    else{pow=14+sp*.5;vy=1.5}}
   v.x=ux*pow;v.z=uz*pow;v.y=vy;pl.cd=.45;sfx("kick")}}
 else if(play&&pl.cd<=0&&p.y<.35&&d<1.8){
  // close control: the ball stays in front of the player and turns with them
  const hx=Math.sin(pl.h),hz=Math.cos(pl.h),lead=inp.ctl?.58:(inp.sprint?1.15:.62)*clamp(.6+sp/8,.75,1.1),
   tx=pl.x+hx*lead,tz=pl.z+hz*lead,g=inp.ctl?26:16,k=Math.min(1,(inp.ctl?30:20)*h);
  v.x+=(pl.vx+(tx-p.x)*g-v.x)*k;v.z+=(pl.vz+(tz-p.z)*g-v.z)*k;
  if(sp>1.5&&S.t-lastTouch2>.28){lastTouch2=S.t;sfx("touch")}}
 d=Math.hypot(p.x-pl.x,p.z-pl.z);
 if(p.y<1.4&&d<.42+R&&d>1e-5){const nx=(p.x-pl.x)/d,nz=(p.z-pl.z)/d;p.x=pl.x+nx*(.42+R);p.z=pl.z+nz*(.42+R);const vn=(v.x-pl.vx)*nx+(v.z-pl.vz)*nz;if(vn<0){v.x-=1.3*vn*nx;v.z-=1.3*vn*nz}}
 // --- defenders
 for(const o of DEF){if(!o.on)continue;o.cd-=h;o.st-=h;o.sl-=h;let gx=o.hx,gz=o.hz;
  if(play&&o.st<=0&&(Math.hypot(pl.x-o.x,pl.z-o.z)<14||Math.hypot(p.x-o.x,p.z-o.z)<10)){gx=p.x+v.x*.22;gz=p.z+v.z*.22}
  const ex=gx-o.x,ez=gz-o.z,el=Math.hypot(ex,ez),ds=(play&&o.st<=0&&el>.15)?o.spd:0,tx=el>1e-4?ex/el*ds:0,tz=el>1e-4?ez/el*ds:0;
  const fx=tx-o.vx,fz=tz-o.vz,fl=Math.hypot(fx,fz);if(fl>1e-6){const m=Math.min(fl,15*h);o.vx+=fx/fl*m;o.vz+=fz/fl*m}
  o.x+=o.vx*h;o.z+=o.vz*h;if(Math.hypot(o.vx,o.vz)>.4)o.h=Math.atan2(o.vx,o.vz);
  const ox=pl.x-o.x,oz=pl.z-o.z,od=Math.hypot(ox,oz);if(od<.75&&od>1e-5){const q=(.75-od)/2;pl.x+=ox/od*q;pl.z+=oz/od*q;o.x-=ox/od*q;o.z-=oz/od*q}
  for(const e2 of DEF){if(e2===o||!e2.on)continue;const qx=e2.x-o.x,qz=e2.z-o.z,qd=Math.hypot(qx,qz);if(qd<.8&&qd>1e-5){const q=(.8-qd)/2;e2.x+=qx/qd*q;e2.z+=qz/qd*q;o.x-=qx/qd*q;o.z-=qz/qd*q}}
  if(play&&o.cd<=0&&p.y<.5&&Math.hypot(p.x-o.x,p.z-o.z)<.75){o.cd=1.6;o.st=.6;o.sl=.5;
   let nx=p.x-o.x,nz=p.z-o.z;const nl=Math.hypot(nx,nz)||1;nx/=nl;nz/=nl;const own=Math.hypot(p.x-pl.x,p.z-pl.z)<3;
   v.x=nx*5+(Math.random()-.5)*2;v.z=Math.abs(nz)*3+3;v.y=1.8;sfx("tackle");
   if(own){pl.cd=.5;S.tk++;S.tkAll++;S.combo=0;S.score=Math.max(0,S.score-10);toast("TACKLED  −10");hc=""}}
  if(play&&!o.b&&pl.z<o.z-.4&&p.z<o.z-.2){o.b=true;S.beaten++;S.combo++;const pts=25+(S.combo>1?10*(S.combo-1):0);S.score+=pts;
   toast(S.combo>1?`DEFENDER BEATEN  x${S.combo}  +${pts}`:`DEFENDER BEATEN  +${pts}`);sfx(S.combo>1?"combo":"beat");hc=""}}
 // --- goalkeeper
 if(ball.v.z<-9&&Math.hypot(v.x,v.y,v.z)>14.5&&p.z<26&&p.z>1){K.react-=h;
  if(K.react<=0){const t=p.z/-v.z,tx=clamp(p.x+v.x*t+K.err,-GW+.3,GW-.3);K.x+=clamp(tx-K.x,-(3+.35*S.round)*h,(3+.35*S.round)*h)}}

 if(p.z<4&&play){const w=Math.max(hit(K.x-.5,1,KZ-.1,.62,.4),hit(K.x+.5,1,KZ-.1,.62,.4));if(w>2.5&&S.t-tkLast>.4){tkLast=S.t;sfx("save")}}

}

 if(S.st==="play"){S.rt-=dt;S.tt+=dt;if(S.rt<=0){S.rt=0;S.st="cel";S.scored=false;S.cel=0;S.resT=2.2;S.rr[S.round]="x";showRes("TIME UP!");sfx("miss");hc=""}}
 else if(S.st==="cel"){S.cel+=dt;S.resT-=dt;if(S.resT<=0){if(S.round+1>=ROUNDS)end();else startRound(S.round+1)}}

 // player pose

 for(const o of DEF){if(!o.on)continue;const s2=Math.hypot(o.vx,o.vz);o.ph=(o.ph||0)+s2*dt*1.4;pose(o,o.ph,Math.min(1,s2/5),.15,S.t);
  if(o.sl>0){o.legR.rotation.x=-1.3;o.hips.rotation.x=-.5}o.g.position.set(o.x,0,o.z);o.g.rotation.y=o.h}

 for(const q of PA)if(q.l>0){q.l-=dt;q.v.y+=G*dt;q.m.position.addScaledVector(q.v,dt);q.m.rotation.x+=dt*8;if(q.l<=0||q.m.position.y<0)q.m.visible=false}
