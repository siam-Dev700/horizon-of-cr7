  const a=(rnd()-.5)*2*err,c=Math.cos(a),s=Math.sin(a),nx=ux*c-uz*s;uz=ux*s+uz*c;ux=nx;

 b.vx=ux*pw;b.vz=uz*pw;b.vy=vy;b.own=null;b.tgt=null;b.lt=p.t;p.kcd=.5;p.hold=0;sfx("kick")}
function selCtl(){const b=ball;
 if(b.own&&b.own.t===0&&!b.own.gk){ctl=b.own;S.sw=false;return}
 if(b.tgt&&b.tgt.t===0&&!b.tgt.gk){ctl=b.tgt;S.sw=false;return}
 let best=null,bd=1e9;for(const p of pls)if(p.t===0&&!p.gk){const dd=H(p.x-b.x,p.z-b.z);if(dd<bd){bd=dd;best=p}}
 if(!ctl||ctl.gk||S.sw||(best&&best!==ctl&&bd<H(ctl.x-b.x,ctl.z-b.z)-2.5))ctl=best;S.sw=false}

/* ===== AI ===== */
function AI(p,h){const t=p.t,d=t?-1:1,b=ball,own=b.own,gx=d*XL;
 if(p.gk){const x=-d*43.3;p.fh=true;p.h=Math.atan2(b.x-p.x,b.z-p.z);
  if(own===p){p.hold+=h;mv(p,0,0,0,h);if(p.hold>.9)kickPass(p,null);return}
  let tz=cl(b.z*.35,-3,3);
  if(!own&&b.vx*(-d)>9&&Math.abs(b.x-x)<30){p.rt+=h;if(p.rt>.3){const tt=(x-b.x)/b.vx;if(tt>0&&tt<2)tz=cl(b.z+b.vz*tt,-GW+.2,GW-.2)}}else p.rt=0;
  go(p,x,tz,3.8,h);return}
 if(own===p){p.dec-=h;const gdx=gx-p.x,gdz=-p.z,dist=H(gdx,gdz);let ax=gdx/dist,az=gdz/dist*.8-p.z*.02,pr=null,pd=99;
  for(const q of pls)if(q.t!==t){const dd=H(q.x-p.x,q.z-p.z);if(dd<pd){pd=dd;pr=q}}
  if(pr&&pd<5){ax+=(p.x-pr.x)/pd*1.2;az+=(p.z-pr.z)/pd*1.2}
  mv(p,ax,az,5.8,h);
  if(p.dec<=0){p.dec=.25+rnd()*.2;
   if(dist<24&&rnd()<.45+(24-dist)/40){kickShot(p,.1);return}
   if((pd<2.6&&rnd()<.6)||rnd()<.05){const r=bestPass(p,null);if(r)kickPass(p,r)}}
  return}
 const hasT=own&&own.t===t;let tx,tz,sp=5.6;
 if(b.tgt===p){tx=b.x+b.vx*.25;tz=b.z+b.vz*.25;sp=7}
 else if(!hasT&&CH[t].includes(p)){if(own){tx=own.x+own.vx*.25;tz=own.z+own.vz*.25}else{tx=b.x+b.vx*.3;tz=b.z+b.vz*.3}sp=6.6}
 else{let hx=(-d*40+d*p.fm[0]*80)*.55+b.x*.45,hz=p.fm[1]*.85+b.z*.3;
  if(hasT)hx+=d*(6+p.fm[0]*14);else if(own)hx-=d*3*(1-p.fm[0]);
  tx=cl(hx,-40,40);tz=cl(hz,-26,26);
  if(hasT&&p.fm[0]>.6){tx=cl(own.x+d*9,-42,42);tz=p.fm[1]*1.2}}
 go(p,tx,tz,sp,h)}

function user(p,h){const b=ball,ix=inp.x,iz=-inp.y,mag=H(ix,iz);
 mv(p,ix,iz,(inp.sprint&&mag>.3?8.4:6.5)*(b.own===p?.94:1),h);
 if(mag<.1&&b.tgt===p)go(p,b.x,b.z,6.5,h);
 if(inp.sh){inp.sh=false;if(b.own===p)kickShot(p,.05);else if(p.lg_<=0){p.lg_=.35;p.vx+=Math.sin(p.h)*5;p.vz+=Math.cos(p.h)*5}}
 if(inp.ps){inp.ps=false;if(b.own===p){const r=bestPass(p,mag>.3?[ix/mag,iz/mag]:[Math.sin(p.h),Math.cos(p.h)]);if(r)kickPass(p,r)}}}

/* ===== ball / rules ===== */
function goal(team){const b=ball;S.sc[team]++;S.st="cel";S.cel=2.8;S.cc=1-team;b.vx=b.vy=b.vz=0;b.own=null;b.tgt=null;b.x=cl(b.x,-XL-1.5,XL+1.5);hc="";hud();sfx("goal");showRes("GOAL! "+S.sc[0]+" – "+S.sc[1])}
function out(){const b=ball,rt=1-b.lt,sg=b.x>0?1:-1;let bx=cl(b.x,-XL+1,XL-1),bz=cl(b.z,-ZL+.6,ZL-.6),p;
 b.vx=b.vy=b.vz=0;b.y=R;b.tgt=null;
 if(Math.abs(b.x)>XL&&rt===(sg>0?1:0)){p=pls[rt*11];p.x=sg*(XL-3);p.z=0;p.h=Math.atan2(-sg,0)}
 else{let bd=1e9;for(const q of pls)if(q.t===rt&&!q.gk){const dd=H(q.x-bx,q.z-bz);if(dd<bd){bd=dd;p=q}}p.x=bx;p.z=bz;p.h=Math.atan2(-bx,-bz)}
 p.vx=p.vz=0;p.hold=0;b.own=p;b.x=p.x;b.z=p.z;ball.lt=rt;toast("OUT")}
function ballStep(h){const b=ball,o=b.own;
 if(o){const hx=Math.sin(o.h),hz=Math.cos(o.h),k=Math.min(1,18*h),ld=.55+H(o.vx,o.vz)*.05;b.x+=(o.x+hx*ld-b.x)*k;b.z+=(o.z+hz*ld-b.z)*k;b.y=R;b.vx=o.vx;b.vz=o.vz;b.vy=0;b.lt=o.t;return}
 b.vy-=9.81*h;b.x+=b.vx*h;b.y+=b.vy*h;b.z+=b.vz*h;
 if(b.y<R){b.y=R;if(b.vy<0){b.vy=-b.vy*.55;if(b.vy<1.2)b.vy=0}const s=H(b.vx,b.vz);if(s>0){const n=Math.max(0,s-1.4*h)*Math.exp(-.35*h);b.vx*=n/s;b.vz*=n/s}}
 if(b.tgt&&H(b.vx,b.vz)<2)b.tgt=null;
 if(Math.abs(b.x)>XL){if(Math.abs(b.z)<GW&&b.y<GH)goal(b.x>0?0:1);else out()}else if(Math.abs(b.z)>ZL)out()}
function interact(h){const b=ball,o=b.own;
 if(o){for(const q of pls){if(q.t===o.t||q.kcd>0||q.gk)continue;const rad=q.lg_>0?1.3:.9;
   if(H(q.x-o.x,q.z-o.z)<rad&&q.tk<=0){q.tk=.35;if(rnd()<(q.lg_>0?.8:q===ctl?.5:.26)){b.own=q;b.lt=q.t;o.kcd=1;q.tk=.6;sfx("tk");if(o.gk)o.hold=0;return}}}}
 else{let bp=null,bd=1e9;
  for(const p of pls){if(p.kcd>0)continue;const dd=H(p.x-b.x,p.z-b.z),rad=p.gk?1.4:.85,hy=p.gk?2.3:.75,sp=H(b.vx,b.vy,b.vz);
   if(dd<rad&&b.y<hy&&(p.gk||b.tgt===p||sp<20)&&dd<bd){bd=dd;bp=p}}
  if(bp){if(bp.gk&&H(b.vx,b.vz)>19&&rnd()<.25){b.vx*=-.35;b.vz+=(rnd()-.5)*6;b.vy=3;bp.kcd=.5;b.lt=bp.t;b.tgt=null;sfx("save");return}
   b.own=bp;b.tgt=null;b.lt=bp.t;bp.hold=0}}}
function step(h){const b=ball;selCtl();
 for(const t of[0,1])CH[t]=pls.filter(p=>p.t===t&&!p.gk&&p!==ctl&&p!==b.own).sort((a,c)=>H(a.x-b.x,a.z-b.z)-H(c.x-b.x,c.z-b.z)).slice(0,2);
 for(const p of pls){p.kcd-=h;p.tk-=h;p.lg_-=h;p.fh=false;if(p===ctl)user(p,h);else AI(p,h);
  p.x=cl(p.x+p.vx*h,-XL-2,XL+2);p.z=cl(p.z+p.vz*h,-ZL-1.5,ZL+1.5);
  const sp=H(p.vx,p.vz);if(!p.fh&&sp>.6){let dh=Math.atan2(p.vx,p.vz)-p.h;dh=Math.atan2(Math.sin(dh),Math.cos(dh));p.h+=cl(dh,-12*h,12*h)}}
 for(let i=0;i<22;i++)for(let j=i+1;j<22;j++){const a=pls[i],c=pls[j],dx=c.x-a.x,dz=c.z-a.z,d=H(dx,dz);if(d<.7&&d>1e-5){const q=(.7-d)/2;a.x-=dx/d*q;a.z-=dz/d*q;c.x+=dx/d*q;c.z+=dz/d*q}}
 interact(h);ballStep(h)}

/* ===== frame ===== */
const camT=new T.Vector3(0,22,32),lookT=new T.Vector3();
function end(){S.st="end";$("res").classList.remove("on");sfx("wh");const a=S.sc[0],c=S.sc[1],r=a>c?"YOU WIN!":a<c?"YOU LOSE":"DRAW";
 menu("FULL TIME",`<p style="text-align:center;font-size:38px;font-family:Georgia,serif;color:var(--gold);margin:6px 0">${a} – ${c}</p><p style="text-align:center"><b>${r}</b></p>`,"PLAY AGAIN",newGame)}
function update(dt){const b=ball;
 if(S.st==="play"){S.acc+=dt;while(S.acc>=1/60){S.acc-=1/60;step(1/60)}S.t+=dt;if(S.t>=MATCH&&S.st==="play")end()}
 else if(S.st==="cel"){S.cel-=dt;if(S.cel<=0)reset(S.cc)}
 if(S.toastT>0){S.toastT-=dt;if(S.toastT<=0)$("toast").style.opacity=0}
 for(const p of pls){const sp=H(p.vx,p.vz),amp=Math.min(1,sp/6);p.ph+=sp*dt*1.8;
  p.lg[0].rotation.x=Math.sin(p.ph)*.9*amp;p.lg[1].rotation.x=-Math.sin(p.ph)*.9*amp;p.body.rotation.x=sp*.02;
  let y=Math.abs(Math.sin(p.ph))*.07*amp;if(S.st==="cel"&&p.t===1-S.cc)y=Math.abs(Math.sin(S.t*8+p.i))*.4+Math.abs(Math.sin(S.cel*8+p.i))*0;
  if(p.lg_>0)p.lg[0].rotation.x=-1.2;
  p.g.position.set(p.x,y,p.z);p.g.rotation.y=p.h}
 ballMesh.position.set(b.x,b.y+R*.4,b.z);const hs=H(b.vx,b.vz);if(hs>.01){ballMesh.rotation.z-=b.vx/R*dt*.6;ballMesh.rotation.x+=b.vz/R*dt*.6}
 ring.visible=!!ctl&&S.st==="play";if(ctl)ring.position.set(ctl.x,.04,ctl.z);hud()}
function render(dt){const b=ball;camT.set(cl(b.x*.92,-34,34),asp<1?30:21,asp<1?38:32);cam.position.lerp(camT,1-Math.exp(-4*dt));lookT.set(cam.position.x,0,2);cam.lookAt(lookT);renderer.render(scene,cam)}
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;
 try{gather();if(S.st!=="paused")update(dt);render(dt)}catch(e){console.error(e)}}
reset(0);S.st="menu";mainMenu();requestAnimationFrame(frame);
}
