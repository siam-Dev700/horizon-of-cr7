const keys={};let lookT=new T.Vector3(0,1.2,0);
const _v=new T.Vector3();
function hud(){$("score").textContent=S.goals+" – "+(S.res.length-S.goals);
 $("dots").innerHTML=Array.from({length:SHOTS},(_,i)=>{const r=S.res[i];return `<i class="${r==="goal"?"g":r?"x":""}">${r==="goal"?"✓":r?"✕":""}</i>`}).join("")}
function reset(){ball.p.set(0,R,SPOT);ball.pp.copy(ball.p);ball.v.set(0,0,0);Object.assign(Kp,{x:0,y:1.4,roll:0,tx:0,ty:1.4,dive:false,decided:false,arms:0});K.g.rotation.set(0,0,0);K.g.position.set(0,0,.4);
 S.F={};S.st="aim";S.power=0;S.charging=false;S.rt=0;$("res").classList.remove("on");P.g.position.copy(PSTART);P.g.rotation.y=Math.atan2(PEND.x-PSTART.x,PEND.z-PSTART.z);
 $("hint").textContent=touchDev?"Use the arrows to aim · tap SHOOT (hold for more power)":"Move mouse / arrows to aim · hold SPACE or mouse to charge · release to shoot";hud()}
function newGame(){S.shots=0;S.goals=0;S.res=[];reset()}

/* ---------- INPUT ---------- */
function aimFromPointer(e){const nx=e.clientX/innerWidth*2-1,ny=1-e.clientY/innerHeight*2;S.aim.x=clamp(nx*5.2,-5,5);S.aim.y=clamp((ny*.5+.5)*3.6,.1,3.3)}
const cv=$("c");
cv.addEventListener("pointermove",e=>{if(S.st==="aim"&&(e.pointerType==="mouse"||e.buttons))aimFromPointer(e)});
cv.addEventListener("pointerdown",e=>{audioInit();if(S.st!=="aim")return;aimFromPointer(e);if(e.pointerType==="touch")return;S.charging=true;$("power").style.display="block"});
addEventListener("pointerup",()=>{if(S.charging&&S.st==="aim")shoot()});
addEventListener("keydown",e=>{keys[e.code]=1;if(e.code==="Space"&&S.st==="aim"&&!e.repeat){audioInit();S.charging=true;$("power").style.display="block"}
 if(e.code==="KeyP")pause();if(e.code==="KeyR")newGame();if(e.code==="KeyM")toggle("m");if(e.code==="Space")e.preventDefault()});
addEventListener("keyup",e=>{keys[e.code]=0;if(e.code==="Space"&&S.charging&&S.st==="aim")shoot()});
// on-screen D-pad: hold a button to move the target
document.querySelectorAll("#pad button").forEach(b=>{const k=b.dataset.k;
 const on=e=>{e.preventDefault();audioInit();keys[k]=1;b.classList.add("d");try{b.setPointerCapture(e.pointerId)}catch(_){}};
 const off=e=>{keys[k]=0;b.classList.remove("d")};
 b.addEventListener("pointerdown",on);b.addEventListener("pointerup",off);b.addEventListener("pointercancel",off);b.addEventListener("lostpointercapture",off)});
// on-screen SHOOT: tap = medium power, hold = charge, release = shoot
const fire=$("fire");
fire.addEventListener("pointerdown",e=>{e.preventDefault();audioInit();if(S.st!=="aim")return;fire.classList.add("d");try{fire.setPointerCapture(e.pointerId)}catch(_){}S.charging=true;S.power=0;fire._t=performance.now();$("power").style.display="block"});
const fireUp=()=>{fire.classList.remove("d");if(S.charging&&S.st==="aim"){if(performance.now()-fire._t<250)S.power=.6;shoot()}};
fire.addEventListener("pointerup",fireUp);fire.addEventListener("pointercancel",fireUp);
function toggle(k){A.on[k]=!A.on[k];$(k==="m"?"bM":"bS").classList.toggle("off",!A.on[k]);audioVol()}
$("bM").onclick=()=>{audioInit();toggle("m")};$("bS").onclick=()=>{audioInit();toggle("s")};
$("vM").oninput=e=>{A.vol.m=e.target.value/100;audioVol()};$("vS").oninput=e=>{A.vol.s=e.target.value/100;audioVol()};
$("bR").onclick=()=>{audioInit();newGame()};$("bP").onclick=pause;
let prevSt=null;
function pause(){if(S.st==="paused"){S.st=prevSt;$("menu").classList.add("h")}else if(S.st==="aim"||S.st==="play"){prevSt=S.st;S.st="paused";menu("PAUSED","<p>Game paused.</p>","RESUME",pause)}}
function menu(sub,html,btn,fn){$("sub").textContent=sub;$("body").innerHTML=html;$("go").textContent=btn;$("go").onclick=()=>{audioInit();$("menu").classList.add("h");fn()};$("menu").classList.remove("h")}
const HOW=touchDev?`<p><b>Aim</b> – use the ◀ ▲ ▼ ▶ buttons (hold to move) or drag on the goal. The gold reticle shows where you are aiming.</p><p><b>Shoot</b> – tap SHOOT for a medium-power shot, or hold it to charge and release. Full power is fast but wild and can sail over the bar.</p><p><b>Goal</b> – the ball must cross the line between the posts and under the bar. The keeper reads your shot. ${SHOTS} penalties per match.</p>`:`<p><b>Aim</b> – mouse, arrow keys / WASD. The gold reticle is where you are aiming on the goal plane.</p><p><b>Power</b> – hold SPACE / mouse to charge, release to shoot. Medium power is accurate; full power is fast but wild and can sail over the bar.</p><p><b>Goal</b> – the ball must fully cross the line between the posts and under the bar. The keeper reads your shot, so use pace and corners. ${SHOTS} penalties per match.</p>`;
menu("PENALTY SHOOTOUT",HOW,"KICK OFF",newGame);

/* ---------- SHOOTING / KEEPER ---------- */
function shoot(){if(S.st!=="aim")return;S.charging=false;$("power").style.display="none";S.st="play";S.rt=0;S.F={};S.launchT=null;S.pw=S.power;sfx("whistle")}
function launch(){const pw=S.pw,e=Math.max(0,pw-.55)*1.3+.1,tx=S.aim.x+(Math.random()-.5)*e*2,ty=S.aim.y+(Math.random()-.5)*e*1.4+Math.max(0,pw-.85)*1.6;
 const Tt=1.35-.93*pw,x0=ball.p.x;ball.v.set((tx-x0)/Tt,(ty-R-.5*G*Tt*Tt)/Tt,-SPOT/Tt);S.launchT=S.t;S.F.launched=true;sfx("kick");S.shots++}
function decide(){const v=ball.v,p=ball.p,t=Math.max(0,(p.z-.4)/-v.z);let px=p.x+v.x*t+(Math.random()-.5)*.9,py=p.y+v.y*t+.5*G*t*t+(Math.random()-.5)*.5;
 if(Math.random()<.15)px=-px*.8;Kp.tx=clamp(px,-3.4,3.4);Kp.ty=clamp(py,.15,2.7);Kp.dive=Math.abs(Kp.tx)>.5||py>1.9;Kp.decided=true;if(Kp.dive)sfx("dive")}
function finish(r){if(S.F.done)return;S.F.done=true;S.res.push(r);if(r==="goal")S.goals++;hud();S.resT=2.6;
 $("res").textContent={goal:"GOAL!",save:"SAVED!",post:"OFF THE POST!",miss:"MISS!"}[r];$("res").classList.add("on");
 if(r==="goal"){sfx("goal");S.crowdT=0}else{sfx("miss")}}

/* ---------- PHYSICS ---------- */
function hit(cx,cy,cz,rad,e){const p=ball.p,v=ball.v,d=_v.set(p.x-cx,p.y-cy,p.z-cz),L=d.length();
 if(L<R+rad&&L>1e-6){d.divideScalar(L);p.set(cx,cy,cz).addScaledVector(d,R+rad);const vn=v.dot(d);if(vn<0){v.addScaledVector(d,-(1+e)*vn);return -vn}}return 0}
function step(h){const p=ball.p,v=ball.v,pp=ball.pp,F=S.F;pp.copy(p);v.y+=G*h;v.multiplyScalar(1-.08*h);p.addScaledVector(v,h);
 if(p.y<R){p.y=R;if(v.y<0){if(v.y<-2)sfx("bounce");v.y=-v.y*.62;if(v.y<.9)v.y=0}const fr=Math.exp(-(v.y?.2:.8)*h*1.4);v.x*=fr;v.z*=fr}
 let w=0;for(const s of[-1,1])w=Math.max(w,hit(s*GW,clamp(p.y,0,GH),0,.06,.55));w=Math.max(w,hit(clamp(p.x,-GW,GW),GH,0,.06,.55));
 if(w>2&&S.t-(F.pt||0)>.2){F.pt=S.t;F.post=true;sfx("post")}
 for(const k of KP){const i=hit(k.w.x,k.w.y,k.w.z,k[1],.1);if(i>0){if(!F.goal){if(v.z<.5)v.z=Math.abs(v.z)*.3+.5;v.y=Math.min(v.y,2)}if(!F.saved&&i>.5){F.saved=true;sfx("save")}}}
 if(pp.z>-R&&p.z<=-R&&!F.passed){F.passed=true;if(Math.abs(p.x)<GW-R*.5&&p.y<GH-R*.5){F.goal=true;sfx("net");finish("goal")}}
 if(p.z<0&&p.z>-2.4&&p.y<GH){for(const s of[-1,1]){const X=s*GW;if((pp.x-X)*(p.x-X)<0){p.x=X+Math.sign(pp.x-X)*R;v.x*=-.12;v.y*=.6;v.z*=.5}}
  if(pp.z>-2&&p.z<=-2&&Math.abs(p.x)<GW){p.z=-2+R;v.z*=-.1;v.x*=.4;v.y*=.4}}
 if(Math.abs(p.x)<GW&&p.z<0&&p.z>-2){if(pp.y<GH&&p.y>=GH){p.y=GH-R;v.y*=-.15;v.x*=.5;v.z*=.5}else if(pp.y>=GH&&p.y<GH+R&&v.y<0){p.y=GH+R;v.y*=-.15;v.x*=.6;v.z*=.6}}
 if(p.z<-6.9){p.z=-6.9;v.z*=-.2}}
const lerpA=(a,b,k)=>a+(b-a)*k;
function poseIdle(H,t,arm){H.hips.rotation.set(0,0,0);H.hips.position.y=1+Math.sin(t*2)*.005;H.torso.rotation.set(0,0,0);H.legL.rotation.set(0,0,0);H.legR.rotation.set(0,0,0);H.kneeL.rotation.x=H.kneeR.rotation.x=0;
 H.armL.rotation.set(0,0,arm);H.armR.rotation.set(0,0,-arm)}
function poseRun(H,ph){const s=Math.sin(ph)*.9;H.legL.rotation.x=-s;H.legR.rotation.x=s;H.kneeL.rotation.x=.3+Math.max(0,s)*.9;H.kneeR.rotation.x=.3+Math.max(0,-s)*.9;
 H.armL.rotation.set(s*.8,0,.1);H.armR.rotation.set(-s*.8,0,-.1);H.hips.rotation.x=-.12;H.hips.position.y=1+Math.abs(Math.sin(ph))*.05}
function poseKick(H,u){const w=u<.35?u/.35:1,f=Math.max(0,(u-.35)/.65);
 H.legR.rotation.x=u<.35?lerpA(1,-1.25,w*w):lerpA(-1.25,-.2,f);H.kneeR.rotation.x=u<.35?lerpA(1.4,.1,w):lerpA(.1,.5,f);
 H.legL.rotation.x=-.2;H.kneeL.rotation.x=.25;H.armL.rotation.set(0,0,.9);H.armR.rotation.set(.4,0,-.9);H.hips.rotation.x=u<.35?.1:-.1;H.hips.position.y=1}

/* ---------- MAIN LOOP ---------- */
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.033);last=now;if(S.st!=="paused")update(dt);render(dt)}
function update(dt){S.t+=dt;const F=S.F;
 document.body.classList.toggle("nogame",S.st!=="aim");
 if(S.st==="aim"){const sp=4*dt;if(keys.ArrowLeft||keys.KeyA)S.aim.x-=sp;if(keys.ArrowRight||keys.KeyD)S.aim.x+=sp;if(keys.ArrowUp||keys.KeyW)S.aim.y+=sp*.7;if(keys.ArrowDown||keys.KeyS)S.aim.y-=sp*.7;
  S.aim.x=clamp(S.aim.x,-5,5);S.aim.y=clamp(S.aim.y,.1,3.3);if(S.charging)S.power=Math.min(1,S.power+dt/1.2);$("power").firstChild.style.width=S.power*100+"%";
  poseIdle(P,S.t,.15);poseIdle(K,S.t*1.5,.7);K.g.position.set(Math.sin(S.t*1.4)*.35,0,.4)}
 else if(S.st==="play"||S.st==="result"){
  S.rt+=dt;
  if(S.rt<RUN){const u=S.rt/RUN;P.g.position.lerpVectors(PSTART,PEND,u);poseRun(P,S.rt*13)}
  else{const u=(S.rt-RUN)/.5;P.g.rotation.y=lerpA(P.g.rotation.y,Math.PI,.15);P.g.position.copy(PEND);poseKick(P,Math.min(u,1));if(!F.launched&&u>=.35)launch()}
  if(F.launched){if(!Kp.decided&&S.t-S.launchT>.2)decide();
   if(Kp.decided){const sp=7*dt;Kp.x+=clamp(Kp.tx-Kp.x,-sp,sp);Kp.y+=clamp(Kp.ty-Kp.y,-sp*.8,sp*.8);
    const rt=Kp.dive?-Math.sign(Kp.tx||1)*Math.min(1.35,.25+Math.abs(Kp.tx)*.4+(Kp.ty<.7?.6:0))*(Math.abs(Kp.tx)>.6?1:.3):0;Kp.roll=lerpA(Kp.roll,rt,Math.min(1,dt*9));Kp.arms=lerpA(Kp.arms,Kp.dive?1:0,Math.min(1,dt*10))}
   K.g.position.set(Kp.x+Math.sin(Kp.roll)*1.5,Math.max(0,Kp.y-1.5*Math.cos(Kp.roll)),.4);K.g.rotation.z=Kp.roll;poseIdle(K,S.t,.7);K.armL.rotation.set(-2.9*Kp.arms,0,.7*(1-Kp.arms));K.armR.rotation.set(-2.9*Kp.arms,0,-.7*(1-Kp.arms));
   if(Kp.dive){K.legL.rotation.x=-.3;K.legR.rotation.x=.3}
   K.g.updateMatrixWorld(true);KP.forEach(k=>k[0].getWorldPosition(k.w));
   for(let i=0;i<8;i++)step(dt/8);
   const sp=ball.v.length();S.still=(sp<.4&&ball.p.y<R+.02)?(S.still||0)+dt:0;
   if(!F.done&&((F.passed&&ball.p.z<-1)||S.still>.6||S.t-S.launchT>6||ball.p.z>18||Math.abs(ball.p.x)>30))finish(F.saved?"save":F.post?"post":"miss")}
  if(F.done){S.st="result";S.resT-=dt;if(S.resT<=0){if(S.res.length>=SHOTS)end();else reset()}}}
 else{poseIdle(P,S.t,.15);poseIdle(K,S.t*1.5,.7);K.g.position.set(Math.sin(S.t*1.4)*.35,0,.4)}
 ballMesh.position.copy(ball.p);const hs=Math.hypot(ball.v.x,ball.v.z);if(hs>.01){_v.set(ball.v.z,0,-ball.v.x).normalize();ballMesh.rotateOnWorldAxis(_v,hs/R*dt)}
 S.crowdT+=dt;crowd.position.y=S.crowdT<3?Math.abs(Math.sin(S.crowdT*9))*.35*(1-S.crowdT/3):0}
function end(){S.st="final";const g=S.goals,msg=g===SHOTS?"Perfect. Pure CR7 composure.":g>=4?"Clinical finishing.":g>=3?"Solid, but the keeper had his moments.":"Keep practising from the spot.";
 menu("FULL TIME",`<p style="text-align:center;font-size:34px;font-family:Cinzel,serif;color:var(--gold);margin:6px 0">${g} / ${SHOTS}</p><p style="text-align:center">${msg}</p>`,"PLAY AGAIN",newGame)}
const tmp=new T.Vector3(),camT=new T.Vector3();
function render(dt){
 if(S.st==="aim"||S.st==="menu"||S.st==="paused"&&!S.F.launched){camT.set(S.aim.x*.12,1.75,14.8);lookT.set(S.aim.x*.1,1.1,0)}
 else{camT.set(ball.p.x*.4,clamp(ball.p.y*.3+1.6,1.6,3),clamp(ball.p.z+4.5,5,14.8));tmp.copy(ball.p);lookT.lerp(tmp,1-Math.exp(-6*dt))}
 if(S.st==="menu"){camT.x=Math.sin(S.t*.3)*3;camT.y=2.2}
 cam.position.lerp(camT,1-Math.exp(-3*dt));cam.lookAt(lookT);
 const c=$("cross");if(S.st==="aim"){tmp.set(S.aim.x,S.aim.y,0).project(cam);c.style.display="block";c.style.left=(tmp.x*.5+.5)*innerWidth+"px";c.style.top=(-tmp.y*.5+.5)*innerHeight+"px";c.style.transform=`scale(${1+S.power*.8})`}else c.style.display="none";
 renderer.render(scene,cam)}
reset();S.st="menu";requestAnimationFrame(frame);
</script></body></html>
